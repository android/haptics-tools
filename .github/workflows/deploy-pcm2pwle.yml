name: Deploy pcm2pwle Executable

on:
  push:
    tags:
      - 'pcm2pwle-v*' # Trigger on pcm2pwle version tags

permissions:
  contents: write # Required to create the release and upload assets

jobs:
  build:
    name: Build on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            extension: ""
            archive_ext: "tar.gz"
          - os: windows-latest
            platform: windows
            extension: ".exe"
            archive_ext: "zip"
          - os: macos-latest
            platform: macos
            extension: ""
            archive_ext: "tar.gz"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller>=5.0.0

    - name: Run PyInstaller
      run: pyinstaller pcm2pwle.spec

    - name: Package Binary
      shell: bash
      run: |
        cd dist
        if [ "${{ matrix.platform }}" = "windows" ]; then
          # On Windows, create a zip archive
          7z a pcm2pwle-${{ matrix.platform }}.zip pcm2pwle${{ matrix.extension }}
        else
          # On Mac/Linux, ensure it is executable, then create a tar.gz
          chmod +x pcm2pwle${{ matrix.extension }}
          tar -czvf pcm2pwle-${{ matrix.platform }}.tar.gz pcm2pwle${{ matrix.extension }}
        fi

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: binary-${{ matrix.platform }}
        path: dist/*.${{ matrix.archive_ext }}

  release:
    name: Create GitHub Release
    needs: build # Wait for all builds to complete
    runs-on: ubuntu-latest
    # ONLY run this job if the trigger was a tag
    if: startsWith(github.ref, 'refs/tags/pcm2pwle-v')
    steps:
    - name: Download All Artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: binary-*
        merge-multiple: true
        path: release-assets

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v3
      with:
        files: |
          release-assets/*.zip
          release-assets/*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
