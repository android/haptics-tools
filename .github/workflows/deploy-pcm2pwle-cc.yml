name: Build and Deploy pcm2pwle C++ Executable

on:
  push:
    branches: [ main ]
    tags:
      - 'pcm2pwle-cc-v*'
      - 'pcm2pwle-v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write # Required to create the release and upload assets

jobs:
  build:
    name: Build on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            extension: ""
            archive_ext: "tar.gz"
          - os: windows-latest
            platform: windows
            extension: ".exe"
            archive_ext: "zip"
          - os: macos-latest
            platform: macos
            extension: ""
            archive_ext: "tar.gz"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libsndfile1-dev cmake ninja-build

    - name: Install Dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install libsndfile cmake ninja

    - name: Install Dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        vcpkg install libsndfile:x64-windows

    - name: Configure CMake
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          TOOLCHAIN="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN"
        else
          cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
        fi

    - name: Build C++ Binary
      run: cmake --build build --config Release

    - name: Report Binary Size
      shell: bash
      run: |
        BIN_PATH="build/pcm2pwle${{ matrix.extension }}"
        if [ "${{ matrix.platform }}" = "windows" ]; then
          BIN_PATH="build/Release/pcm2pwle${{ matrix.extension }}"
          if [ ! -f "$BIN_PATH" ]; then
            BIN_PATH="build/pcm2pwle${{ matrix.extension }}"
          fi
        fi
        echo "=== Native Binary Size ==="
        ls -lh "$BIN_PATH"
        if command -v size >/dev/null 2>&1; then
          size "$BIN_PATH" || true
        fi
        echo "=========================="

    - name: Package Binary
      shell: bash
      run: |
        mkdir -p dist
        BIN_PATH="build/pcm2pwle${{ matrix.extension }}"
        if [ "${{ matrix.platform }}" = "windows" ]; then
          BIN_PATH="build/Release/pcm2pwle${{ matrix.extension }}"
          if [ ! -f "$BIN_PATH" ]; then
            BIN_PATH="build/pcm2pwle${{ matrix.extension }}"
          fi
          cp "$BIN_PATH" dist/pcm2pwle.exe
          cd dist
          7z a pcm2pwle-${{ matrix.platform }}.zip pcm2pwle.exe
        else
          cp "$BIN_PATH" dist/pcm2pwle
          cd dist
          chmod +x pcm2pwle
          tar -czvf pcm2pwle-${{ matrix.platform }}.tar.gz pcm2pwle
        fi

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: binary-${{ matrix.platform }}
        path: dist/*.${{ matrix.archive_ext }}

  release:
    name: Create GitHub Release
    needs: build # Wait for all builds to complete
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/pcm2pwle')
    steps:
    - name: Download All Artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: binary-*
        merge-multiple: true
        path: release-assets

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v3
      with:
        files: |
          release-assets/*.zip
          release-assets/*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
