name: Deploy PCM to PWLE Executables

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Deploy on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # When adding another OS, also add to copybara's github_check_runs.
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: pip install -r requirements.txt

    - name: Run PyInstaller
      run: pyinstaller --onefile pcm_to_pwle.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pcm_to_pwle_${{ matrix.os }}
        path: dist/