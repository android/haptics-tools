name: Deploy PCM to PWLE Executables

on:
  push:
    tags:
      - 'v*' # Trigger on version tags

permissions:
  contents: write # Required to create the release and upload assets

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: pip install -r requirements.txt

    - name: Run PyInstaller
      run: >
        pyinstaller --onefile pcm2pwle/__main__.py --name pcm2pwle
        --hidden-import PyQt6
        --hidden-import matplotlib.backends.backend_qtagg
        --hidden-import matplotlib.backends.backend_pdf
        --hidden-import matplotlib.backends.backend_svg

    - name: Package Binary
      shell: bash
      run: |
        cd dist
        if [ "${{ runner.os }}" = "Windows" ]; then
          # On Windows, create a zip archive
          7z a pcm2pwle-${{ matrix.os }}.zip pcm2pwle.exe
        else
          # On Mac/Linux, ensure it is executable, then create a tar.gz
          chmod +x pcm2pwle
          tar -czvf pcm2pwle-${{ matrix.os }}.tar.gz pcm2pwle
        fi

    - name: Upload Build Artifact Zip
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v7
      with:
        name: binary-${{ matrix.os }}
        path: dist/*.zip

    - name: Upload Build Artifact Tar
      if: runner.os != 'Windows'
      uses: actions/upload-artifact@v7
      with:
        name: binary-${{ matrix.os }}
        path: dist/*.tar.gz

  release:
    name: Create GitHub Release
    needs: build # Wait for all builds to complete
    runs-on: ubuntu-latest
    # ONLY run this job if the trigger was a tag
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Download All Artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: binary-*
        merge-multiple: true
        path: release-assets

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v3
      with:
        files: |
          release-assets/*.zip
          release-assets/*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
