name: Deploy PCM to PWLE Executables

on:
  push:
    tags:
      - 'v*' # Trigger on version tags

permissions:
  contents: write # Required to create the release and upload assets

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: pip install -r requirements.txt

    - name: Run PyInstaller
      run: pyinstaller --onefile pcm2pwle/pcm_to_pwle.py

    - name: Prepare Binary
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          mv dist/pcm_to_pwle.exe dist/pcm_to_pwle-${{ matrix.os }}.exe
        else
          chmod +x dist/pcm_to_pwle
          mv dist/pcm_to_pwle dist/pcm_to_pwle-${{ matrix.os }}
        fi

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-${{ matrix.os }}
        path: dist/pcm_to_pwle-*

  release:
    name: Create GitHub Release
    needs: build # Wait for all builds to complete
    runs-on: ubuntu-latest
    # ONLY run this job if the trigger was a tag
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: binary-*
        merge-multiple: true
        path: release-assets

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        files: release-assets/pcm_to_pwle-*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
